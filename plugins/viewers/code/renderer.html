<!doctype html><meta charset="utf-8">
<style>body{margin:0;padding:24px;font:14px/1.7 ui-monospace,monospace}h1{font:600 16px system-ui}pre{white-space:pre-wrap;overflow-wrap:anywhere}.comment{color:#8cbf99}.keyword{color:#bcabef}</style>
<h1 id="title"></h1><pre id="code"></pre>
<script>
addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='continued:render')return;
 const {name,text}=event.data;document.getElementById('title').textContent=name;
 const code=document.getElementById('code');code.replaceChildren();
 // Lightweight highlighting, not a complete language parser.
 for(const part of text.split(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|\b(?:const|let|var|function|return|import|export|class|if|else|async|await)\b)/g)){
  const span=document.createElement('span');span.textContent=part;
  if(part.startsWith('//')||part.startsWith('/*'))span.className='comment';
  else if(/^(const|let|var|function|return|import|export|class|if|else|async|await)$/.test(part))span.className='keyword';
  code.append(span);
 }
});
</script>
