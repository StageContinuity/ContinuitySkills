<!doctype html><meta charset="utf-8"><style>body{margin:22px;background:#1a1d23;color:#dce1e9;font:14px/1.7 system-ui}h1{font-size:19px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace}table{border-collapse:collapse}td{border:1px solid #384150;padding:6px 12px;white-space:pre-wrap;max-width:500px;overflow-wrap:anywhere}tr:first-child{background:#293548;font-weight:600}.note{color:#abb5c5}</style><h1 id="name"></h1><p class="note" id="note"></p><main id="content"></main>
<script>
function rows(text,separator){const out=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(c===separator&&!quoted){row.push(value);value='';}else if(c==='\n'&&!quoted){row.push(value.replace(/\r$/,''));out.push(row);row=[];value='';if(out.length>=501)break;}else value+=c;}if(out.length<501&&(row.length||value)){row.push(value);out.push(row);}return out;}
addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='continued:render')return;const {name,text,format}=e.data,main=document.getElementById('content');main.replaceChildren();document.getElementById('name').textContent=name;document.getElementById('note').textContent='Read only';
try{if(format==='json'){const pre=document.createElement('pre');pre.textContent=JSON.stringify(JSON.parse(text),null,2);main.append(pre);}else{const data=rows(text,format==='tsv'?'\t':','),table=document.createElement('table');for(const values of data.slice(0,500)){const tr=document.createElement('tr');for(const value of values.slice(0,40)){const td=document.createElement('td');td.textContent=value;tr.append(td);}table.append(tr);}main.append(table);document.getElementById('note').textContent='Read only · Up to 500 rows and 40 columns shown';}}
catch(error){const pre=document.createElement('pre');pre.textContent='Cannot parse this document: '+error.message;main.append(pre);}});
</script>
